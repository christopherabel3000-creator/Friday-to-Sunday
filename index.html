<div id="sr" class="sr-only" aria-live="polite" aria-atomic="true"></div>
<script>
// Every file's address carries the version (?v=), so an update brings all new files together. If the
// browser still ends up with a mix of old and new files, one of the game's own scripts fails before the
// game starts: load the page once more, fresh, and if that fails too, say so and say what failed.
// Errors from anything else (a browser extension, say) are left alone, and once the game has started
// this never steps in.
window.FTS_BOOT = { ok: false };
window.addEventListener("error", function (e) {
  var B = window.FTS_BOOT, file = (e && e.filename) || "";
  if (B.ok || B.shown || file.indexOf(location.origin + location.pathname.replace(/[^/]*$/, "") + "js/") !== 0) return;
  var u = new URL(location.href);
  if (!u.searchParams.has("fresh")) { u.searchParams.set("fresh", String(Date.now())); location.replace(u.href); return; }
  B.shown = true;
  var what = String((e.message || "an error") + " in " + file.replace(/^.*\/js\//, "").replace(/\?.*$/, "") + (e.lineno ? ", line " + e.lineno : ""));
  var show = function () {
    if (B.ok) return;
    var app = document.getElementById("app");
    if (!app) return;
    app.innerHTML = '<h1 tabindex="-1" id="bootfail">Friday to Sunday couldn\'t start</h1><p>Your saves are safe. Load the page again in a minute. If this keeps happening, send this to the developer: <span id="bootwhy"></span></p><button class="btn" onclick="location.replace(location.pathname + \'?fresh=\' + Date.now())">Load the page again</button>';
    document.getElementById("bootwhy").textContent = what;
    document.getElementById("bootfail").focus();
  };
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", show); else show();
});
</script>
